<style>
:root{--bg:rgb(10,10,25);--text:rgb(240,242,255);--muted:rgb(170,175,205);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;color:var(--text);line-height:1.6;background:var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:radial-gradient(circle at 15% 20%,rgba(255,40,80,.35),transparent 40%),
radial-gradient(circle at 85% 30%,rgba(40,255,130,.30),transparent 40%),
radial-gradient(circle at 50% 90%,rgba(50,120,255,.38),transparent 45%);
background-size:200% 200%;animation:geser 14s ease-in-out infinite alternate}
@keyframes geser{to{background-position:100% 100%}}
.logo,h1,.hero span{background:linear-gradient(90deg,rgb(255,40,80),rgb(40,255,130),rgb(50,120,255),rgb(255,40,80));
background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:pelangi 6s linear infinite}
@keyframes pelangi{to{background-position:300% 0}}
header{background:rgba(10,10,25,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:0;z-index:10;
border-bottom:2px solid transparent;border-image:linear-gradient(90deg,rgb(255,40,80),rgb(40,255,130),rgb(50,120,255)) 1}
nav{max-width:1000px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 20px}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:1px}
nav ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
nav a{color:var(--text);text-decoration:none;padding:7px 14px;border-radius:999px;font-size:.92rem;transition:all .25s}
nav a:hover{background:rgba(255,255,255,.12);box-shadow:0 0 12px rgba(50,120,255,.8);transform:translateY(-2px)}
nav a.active{background:linear-gradient(90deg,rgb(255,40,80),rgb(50,120,255));color:#fff;box-shadow:0 0 14px rgba(255,40,80,.7)}
main{max-width:1000px;margin:auto;padding:40px 20px;min-height:70vh}
h1{font-size:2.2rem;margin-bottom:16px;font-weight:800}
h2{margin:20px 0 8px;color:rgb(40,255,130)}
p{color:var(--muted);margin-bottom:12px}
.sub{margin-bottom:28px}
.hero{text-align:center;padding:80px 10px}
.hero h1{font-size:3rem;color:var(--text);-webkit-text-fill-color:var(--text);background:none;animation:none}
.hero span{font-size:3.2rem;font-weight:800}
.btn{display:inline-block;margin-top:18px;padding:12px 30px;background:linear-gradient(90deg,rgb(255,40,80),rgb(40,255,130),rgb(50,120,255));
background-size:200% 100%;color:rgb(10,10,25);font-weight:700;text-decoration:none;border-radius:999px;box-shadow:0 0 18px rgba(50,120,255,.6);transition:all .3s;animation:pelangi 5s linear infinite}
.btn:hover{transform:scale(1.07);box-shadow:0 0 28px rgba(40,255,130,.9)}
.card{position:relative;isolation:isolate;background:rgba(20,20,40,.85);padding:26px;border-radius:16px;margin-bottom:22px}
.card::before{content:"";position:absolute;inset:-2px;z-index:-1;border-radius:18px;background:linear-gradient(135deg,rgb(255,40,80),rgb(40,255,130),rgb(50,120,255));filter:blur(5px);opacity:.75}
table{width:100%;border-collapse:collapse}
td{padding:12px;border-bottom:1px solid rgba(255,255,255,.15)}
td:first-child{width:38%;font-weight:700;color:rgb(50,170,255)}
tr:last-child td{border-bottom:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
figure{position:relative;isolation:isolate;border-radius:18px;padding:6px;background:linear-gradient(135deg,rgb(255,40,80),rgb(40,255,130),rgb(50,120,255));transition:all .3s}
figure::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:18px;background:inherit;filter:blur(10px);opacity:.7}
figure:hover{transform:translateY(-6px) scale(1.03)}
figure img{display:block;width:100%;height:260px;object-fit:cover;border-radius:14px;background:rgb(20,20,40)}
figcaption{padding:10px 8px 6px;text-align:center;font-weight:600;color:rgb(10,10,25)}
.video{aspect-ratio:16/9;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.5);box-shadow:0 0 28px rgba(255,40,80,.5),0 0 48px rgba(50,120,255,.4)}
.play{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,rgb(255,40,80),rgb(50,120,255));display:flex;align-items:center;justify-content:center;font-size:28px}
iframe.video{width:100%;border:0}
.form-box{margin-top:16px;border-radius:14px;overflow:hidden;background:#fff}
.form-box iframe{display:block;width:100%;height:900px;border:0}
footer{text-align:center;padding:22px;color:var(--muted);background:rgba(10,10,25,.75);border-top:2px solid transparent;
border-image:linear-gradient(90deg,rgb(50,120,255),rgb(40,255,130),rgb(255,40,80)) 1}
@media(max-width:600px){.hero h1{font-size:2rem}.hero span{font-size:2.2rem}nav,nav ul{justify-content:center}figure img{height:220px}.form-box iframe{height:1100px}td{display:block;width:100%!important;padding:6px 12px}td:first-child{padding-top:12px;border-bottom:none}}
</style>
</head>
